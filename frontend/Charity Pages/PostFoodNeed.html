<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Food Need - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="charity" data-page="post-need">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Post a New Food Need</h1>
            <p class="page-lede">Tell donors what you need and where to bring it.</p>
          </div>
        </div>

        <div class="narrow">
          <form id="foodNeedForm" class="panel card">
            <div class="field">
              <label for="foodItem">Food Item</label>
              <input type="text" id="foodItem" name="foodItem" class="input" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" step="any" class="input" required />
              </div>
              <div class="field">
                <label for="unit">Unit</label>
                <select id="unit" name="unit" class="input" required>
                  <option value="kg">kg</option>
                  <option value="l">litre(s)</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="pickupLocation">Pickup Location</label>
              <input type="text" id="pickupLocation" name="pickupLocation" class="input" required />
            </div>
            <div class="field">
              <label for="notes">Additional Notes</label>
              <textarea id="notes" name="notes" class="input" placeholder="Any extra information..."></textarea>
            </div>
            <button type="submit" class="pill pill--solid pill--block">
              Submit Need
              <span class="pill-arrow">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>
          </form>

          <div id="need-posted" class="panel card" hidden>
            <p class="alert alert--success" style="margin-bottom: 1rem">Food need submitted!</p>
            <div class="btn-row">
              <button type="button" class="btn btn--solid" id="another-need-btn">Post Another Need</button>
              <a class="btn" href="./Requests.html">View Requests</a>
            </div>
          </div>

          <p style="margin-top: 1.5rem">
            <a class="link" href="./CharityDashboard.html">&larr; Back to Dashboard</a>
          </p>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const charity = getCharity();
      const form = document.getElementById("foodNeedForm");
      const posted = document.getElementById("need-posted");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        // Only verified charities can post
        if (!charity.verified) {
          showToast(
            "You must verify your account before posting a new food need.",
            "error"
          );
          setTimeout(() => (window.location.href = "Profile.html"), 1800);
          return;
        }
        const submitBtn = form.querySelector('[type="submit"]');
        const foodNeed = {
          orgName: charity.name || "",
          date: new Date().toISOString().slice(0, 10),
          foodItem: document.getElementById("foodItem").value,
          quantity:
            document.getElementById("quantity").value +
            " " +
            document.getElementById("unit").value,
          pickupLocation: document.getElementById("pickupLocation").value,
          notes: document.getElementById("notes").value,
          status: "Pending",
        };
        setBusy(submitBtn, true);
        try {
          const res = await fetch(`${API_BASE_URL}/api/foodneeds`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(foodNeed),
          });
          if (!res.ok) throw new Error("Failed to submit food need");
          form.hidden = true;
          posted.hidden = false;
        } catch (err) {
          showToast("Error submitting food need. Please try again.", "error");
        }
        setBusy(submitBtn, false);
      });

      document.getElementById("another-need-btn").onclick = function () {
        form.reset();
        form.hidden = false;
        posted.hidden = true;
      };
    </script>
  </body>
</html>
