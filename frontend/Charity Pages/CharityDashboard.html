<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charity Dashboard - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="charity" data-page="dashboard">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title" id="charity-greeting"></h1>
            <p class="page-lede">Your food needs and the donations you have received.</p>
          </div>
          <div class="btn-row">
            <a class="btn btn--solid" href="./PostFoodNeed.html">Post a New Food Need</a>
            <a class="btn" href="./BrowseDonorOffers.html">Browse Donor Offers</a>
          </div>
        </div>

        <div class="stack">
          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">Active Requests</span>
              <span class="stat-value" id="stat-active">--</span>
            </div>
            <div class="stat">
              <span class="stat-label">Total Donations Received</span>
              <span class="stat-value" id="total-donations-kg">--</span>
            </div>
            <div class="stat">
              <span class="stat-label">Total Benefactors</span>
              <span class="stat-value" id="stat-served">--</span>
            </div>
          </div>

          <div class="panel card">
            <div class="card-head">
              <h2 class="card-title">Recent Activity</h2>
            </div>
            <div class="table-wrap">
              <table class="table" id="recent-activity-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Food Item</th>
                    <th>Quantity</th>
                    <th>Pickup Location</th>
                    <th>Notes</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="recent-activity-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const charity = getCharity();
      document.getElementById("charity-greeting").textContent =
        "Welcome back, " + charity.name;

      // Quantities are stored as text like "25 kg"; pull out the number
      const toNumber = (value) =>
        parseFloat(String(value).replace(/[^\d.]/g, "")) || 0;
      const day = (value) => (value ? String(value).slice(0, 10) : "");

      // Load this charity's food needs and completed donor offers
      async function renderRecentActivity() {
        const tbody = document.getElementById("recent-activity-body");
        tbody.innerHTML = noteRow(7, "Loading activity...");
        try {
          const res = await fetch(
            `${API_BASE_URL}/api/foodneeds?org=${encodeURIComponent(charity.name)}`
          );
          if (!res.ok) throw new Error("Failed to fetch food needs");
          const foodNeeds = await res.json();

          // Completed donor offers made to this charity
          let donorOffers = [];
          if (charity.id) {
            try {
              const offersRes = await fetch(
                `${API_BASE_URL}/api/donor-offers/${charity.id}`
              );
              if (offersRes.ok) {
                const offersData = await offersRes.json();
                donorOffers = (offersData.offers || []).filter(
                  (offer) => offer.status === "Completed"
                );
              }
            } catch (err) {
              console.error("Error fetching donor offers:", err);
            }
          }

          // Stats
          const completedNeeds = foodNeeds.filter(
            (need) => need.status === "Completed"
          );
          const needsKg = completedNeeds
            .filter((need) => String(need.quantity).toLowerCase().includes("kg"))
            .reduce((sum, need) => sum + toNumber(need.quantity), 0);
          const offersKg = donorOffers
            .filter((offer) =>
              String(offer.unit || "").toLowerCase().includes("kg")
            )
            .reduce((sum, offer) => sum + toNumber(offer.quantity), 0);
          document.getElementById("stat-active").textContent = foodNeeds.filter(
            (need) => need.status === "Pending"
          ).length;
          document.getElementById("total-donations-kg").textContent =
            needsKg + offersKg + " kg";
          // Completed requests count as beneficiaries served
          document.getElementById("stat-served").textContent =
            completedNeeds.length;

          // Merge food needs and donor offers, newest first
          const activityRows = [
            ...foodNeeds.map((need) => ({
              date: day(need.date),
              type: "Request",
              food_item: need.food_item,
              quantity: need.quantity,
              pickup_location: need.pickup_location,
              notes: need.notes || "",
              status: need.status,
            })),
            ...donorOffers.map((offer) => ({
              date: day(offer.completed_at || offer.updated_at || offer.created_at),
              type: "Donation",
              food_item: offer.food_type || offer.food_item || "",
              quantity:
                (offer.quantity || "") + (offer.unit ? " " + offer.unit : ""),
              pickup_location:
                offer.pickup_address || offer.pickup_location || "",
              notes: offer.notes || offer.message || "",
              status: offer.status || "Completed",
            })),
          ].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

          tbody.innerHTML = activityRows.length
            ? activityRows
                .map(
                  (row) => `<tr>
                    <td class="num">${esc(row.date)}</td>
                    <td>${esc(row.type)}</td>
                    <td>${esc(row.food_item)}</td>
                    <td class="num">${esc(row.quantity)}</td>
                    <td>${esc(row.pickup_location)}</td>
                    <td>${esc(row.notes)}</td>
                    <td>${statusBadge(row.status)}</td>
                  </tr>`
                )
                .join("")
            : noteRow(7, "No food needs or donations yet.");
        } catch (err) {
          tbody.innerHTML = noteRow(7, "Error loading activity.");
        }
      }
      renderRecentActivity();
    </script>
  </body>
</html>
