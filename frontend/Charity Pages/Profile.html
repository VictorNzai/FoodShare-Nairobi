<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charity Profile - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="charity" data-page="profile">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Profile</h1>
            <p class="page-lede">Your organization's details and verification.</p>
          </div>
        </div>

        <div class="narrow stack">
          <div class="panel card">
            <div class="profile-head">
              <span class="avatar avatar--lg" id="profileAvatar"></span>
              <div>
                <h2 class="profile-name" id="charityName"></h2>
                <span id="verifyStatus"></span>
              </div>
            </div>
            <dl class="detail-list" id="profileDetails"></dl>
            <div class="card-foot" style="justify-content: flex-start" id="profileActions">
              <button type="button" class="btn btn--solid" onclick="showEditForm()">Edit Profile</button>
              <button type="button" class="btn" id="verifyBtn" onclick="showVerifyForm()" hidden>Verify Account</button>
              <button type="button" class="btn btn--danger" onclick="deleteAccount()">Delete Account</button>
            </div>
          </div>

          <form id="editForm" class="panel card" hidden>
            <div class="card-head">
              <h2 class="card-title">Edit Profile</h2>
            </div>
            <div class="field">
              <label for="editName">Organization Name</label>
              <input type="text" id="editName" name="editName" class="input" autocomplete="organization" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="editAddress">Address</label>
                <input type="text" id="editAddress" name="editAddress" class="input" required />
              </div>
              <div class="field">
                <label for="editContact">Contact Phone/Email</label>
                <input type="text" id="editContact" name="editContact" class="input" required />
              </div>
            </div>
            <div class="field">
              <label for="editDesc">Description</label>
              <textarea id="editDesc" name="editDesc" class="input" required></textarea>
            </div>
            <div class="btn-row">
              <button type="submit" class="btn btn--solid">Save Changes</button>
              <button type="button" class="btn btn--quiet" onclick="document.getElementById('editForm').hidden = true">Cancel</button>
            </div>
          </form>

          <form id="verifyForm" class="panel card" enctype="multipart/form-data" hidden>
            <div class="card-head">
              <h2 class="card-title">Verify Account</h2>
            </div>
            <div class="field">
              <label for="idUpload">Upload Tax Compliance Certificate</label>
              <input type="file" id="idUpload" name="idUpload" class="input" accept="image/*,.pdf" required />
            </div>
            <div class="field">
              <label for="certUpload">Upload Certificate of Incorporation</label>
              <input type="file" id="certUpload" name="certUpload" class="input" accept="image/*,.pdf" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="address">Organization Address</label>
                <input type="text" id="address" name="address" class="input" required />
              </div>
              <div class="field">
                <label for="contact">Contact Phone/Email</label>
                <input type="text" id="contact" name="contact" class="input" required />
              </div>
            </div>
            <div class="field">
              <label for="desc">Organization Description</label>
              <textarea id="desc" name="desc" class="input" required></textarea>
            </div>
            <div class="btn-row">
              <button type="submit" class="btn btn--solid">Submit Verification</button>
              <button type="button" class="btn btn--quiet" onclick="document.getElementById('verifyForm').hidden = true">Cancel</button>
            </div>
          </form>

          <p><a class="link" href="./CharityDashboard.html">&larr; Back to Dashboard</a></p>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const charity = getCharity();

      function setCharity(updated) {
        localStorage.setItem("jwt", JSON.stringify(updated));
      }

      // Name, avatar and verification status
      function renderProfile() {
        document.getElementById("charityName").textContent = charity.name;
        document.getElementById("profileAvatar").textContent = initials(
          charity.name
        );
        document.getElementById("verifyStatus").innerHTML = statusBadge(
          charity.verified
            ? "Verified"
            : charity.verificationPending
            ? "Verification Pending"
            : "Not Verified"
        );
        const details = [];
        if (charity.address) details.push(["Address", charity.address]);
        if (charity.contact) details.push(["Contact", charity.contact]);
        if (charity.desc) details.push(["Description", charity.desc]);
        document.getElementById("profileDetails").innerHTML = details
          .map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`)
          .join("");
        // Offer verification until documents have been sent
        document.getElementById("verifyBtn").hidden =
          charity.verified || charity.verificationPending;
      }
      renderProfile();

      // --- Edit profile ---
      function showEditForm() {
        const form = document.getElementById("editForm");
        form.editName.value = charity.name || "";
        form.editAddress.value = charity.address || "";
        form.editContact.value = charity.contact || "";
        form.editDesc.value = charity.desc || "";
        form.hidden = false;
        form.editName.focus();
      }

      document.getElementById("editForm").onsubmit = function (e) {
        e.preventDefault();
        const form = e.target;
        setCharity({
          ...charity,
          name: form.editName.value,
          address: form.editAddress.value,
          contact: form.editContact.value,
          desc: form.editDesc.value,
        });
        showToast("Profile updated!", "success");
        setTimeout(() => window.location.reload(), 1000);
      };

      // --- Verification: upload documents for an admin to review ---
      function showVerifyForm() {
        const form = document.getElementById("verifyForm");
        form.hidden = false;
        form.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      document.getElementById("verifyForm").onsubmit = async function (e) {
        e.preventDefault();
        const form = e.target;
        const submitBtn = form.querySelector('[type="submit"]');
        const formData = new FormData(form);
        formData.append("charityName", charity.name);
        submitBtn.disabled = true;
        try {
          const response = await fetch(`${API_BASE_URL}/api/verify-charity`, {
            method: "POST",
            body: formData,
          });
          if (response.ok) {
            showToast(
              "Verification submitted! Your documents and info have been sent for review.",
              "success"
            );
            // Remember that documents were sent, so the page keeps saying so
            Object.assign(charity, {
              verified: false,
              verificationPending: true,
              address: form.address.value,
              contact: form.contact.value,
              desc: form.desc.value,
            });
            setCharity(charity);
            form.hidden = true;
            renderProfile();
          } else {
            showToast(
              "Failed to submit verification. Please try again.",
              "error"
            );
          }
        } catch (err) {
          showToast("Network error. Please try again.", "error");
        }
        submitBtn.disabled = false;
      };

      // --- Delete account ---
      // TODO: there is no server endpoint a charity can call to delete its
      // account yet, so this only signs out and clears this browser.
      async function deleteAccount() {
        const ok = await confirmDialog(
          "Deleting your account online isn't available yet. This will sign you out and clear your details from this browser. Your account stays on FoodShare.",
          {
            title: "Sign out and clear this device?",
            confirmLabel: "Sign out and clear",
            danger: true,
          }
        );
        if (ok) logout();
      }
    </script>
  </body>
</html>
