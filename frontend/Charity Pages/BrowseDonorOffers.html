<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donor Offers - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <style>
      /* Two actions may stack so the table fits without scrolling */
      .table .btn-row {
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="charity" data-page="offers">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Donor Offers</h1>
            <p class="page-lede">Food that donors have offered to your charity.</p>
          </div>
        </div>

        <div class="panel card">
          <div class="table-wrap">
            <table class="table" id="offers-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Donor</th>
                  <th>Food Item</th>
                  <th>Quantity</th>
                  <th>Message</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="offers-body"></tbody>
            </table>
          </div>
        </div>

        <dialog class="dialog" id="details-modal" aria-labelledby="detailsModalTitle">
          <h2 class="dialog-title" id="detailsModalTitle">Offer Details</h2>
          <dl class="detail-list" id="modal-details-content"></dl>
          <div class="dialog-actions" id="modal-details-footer"></div>
        </dialog>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const charity = getCharity();
      const modal = document.getElementById("details-modal");

      // Offers made to this charity
      async function renderOffers() {
        const tbody = document.getElementById("offers-body");
        if (!charity.id) {
          // Sessions created before this change did not store the charity's id
          tbody.innerHTML = noteRow(
            7,
            "Please log out and log in again to see the offers made to your charity."
          );
          return;
        }
        tableLoading(tbody, ["num", "text", "text", "num", "text", "badge", "btn"]);
        try {
          const res = await fetch(`${API_BASE_URL}/api/donor-offers/${charity.id}`);
          if (!res.ok) throw new Error("Failed to fetch offers");
          const offers = (await res.json()).offers || [];
          tbody.innerHTML = offers.length
            ? offers
                .map((offer) => {
                  const id = Number(offer.id);
                  const status = offer.status || "Pending";
                  return `<tr>
                    <td class="num">${esc(
                      offer.created_at ? String(offer.created_at).slice(0, 10) : ""
                    )}</td>
                    <td>${esc(offer.donor_name || offer.donorId || "")}</td>
                    <td>${esc(offer.food_type || "")}${expiryNote(offer)}</td>
                    <td class="num">${esc(offer.quantity || "")} ${esc(
                    offer.unit || ""
                  )}</td>
                    <td>${esc(offer.notes || offer.message || "")}</td>
                    <td>${statusBadge(status)}${
                    status === "Scheduled" && offer.pickup_at
                      ? `<span class="cell-sub">Pickup ${esc(formatPickup(offer.pickup_at))}</span>`
                      : ""
                  }</td>
                    <td><div class="btn-row">
                      <button type="button" class="btn btn--quiet" onclick="showOffer(${id})">View Details</button>
                      ${
                        status === "Pending"
                          ? `<button type="button" class="btn btn--danger" onclick="denyOffer(${id})">Deny</button>`
                          : ""
                      }
                    </div></td>
                  </tr>`;
                })
                .join("")
            : noteRow(7, "No donor offers at this time.");
        } catch (err) {
          tbody.innerHTML = noteRow(7, "Error loading donor offers.");
        }
      }

      // "2026-10-05T14:00" -> "2026-10-05 14:00"
      const formatPickup = (value) => String(value).replace("T", " ");

      // Expiry date under the food item; pending offers close to it are flagged
      function expiryNote(offer) {
        if (!offer.expiry) return "";
        const expiry = new Date(offer.expiry);
        const daysLeft = (expiry - Date.now()) / 86400000;
        const flag =
          (offer.status || "Pending") !== "Pending" || daysLeft > 2
            ? ""
            : " " + statusBadge(daysLeft < -1 ? "Expired" : "Expires soon");
        return `<span class="cell-sub">Expires ${esc(
          expiry.toLocaleDateString()
        )}${flag}</span>`;
      }

      // POST an action for an offer; throws the server's message if it refuses
      async function offerAction(id, action, body = {}) {
        const res = await fetch(`${API_BASE_URL}/api/donor-offers/${id}/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.message || `Failed to ${action} offer`);
        }
      }

      async function denyOffer(id) {
        const ok = await confirmDialog("The donor's offer will be turned down.", {
          title: "Deny this offer?",
          confirmLabel: "Deny",
          danger: true,
        });
        if (!ok) return;
        try {
          await offerAction(id, "deny");
          showToast("Offer denied.", "success");
          renderOffers();
        } catch (err) {
          showToast("Error denying offer.", "error");
        }
      }

      // Always fetch the latest details for the dialog
      async function showOffer(id) {
        const content = document.getElementById("modal-details-content");
        const footer = document.getElementById("modal-details-footer");
        content.innerHTML = skeletonDetails(5);
        footer.innerHTML =
          '<button type="button" class="btn btn--quiet" id="details-close">Close</button>';
        document.getElementById("details-close").onclick = () => modal.close();
        if (!modal.open) modal.showModal();

        let offer = null;
        try {
          const res = await fetch(`${API_BASE_URL}/api/donor-offers/offer/${id}`);
          if (res.ok) offer = (await res.json()).offer || null;
        } catch {}
        if (!offer) {
          content.innerHTML = "<dt>Could not load offer details.</dt>";
          return;
        }

        const status = offer.status || "Pending";
        const rows = [
          ["Donor", offer.donor_name || offer.donorId || ""],
          ["Food Item", offer.food_type || ""],
          ["Quantity", `${offer.quantity || ""} ${offer.unit || ""}`],
          ["Message", offer.notes || offer.message || "-"],
        ];
        if (offer.expiry) {
          rows.push(["Expiry Date", new Date(offer.expiry).toLocaleDateString()]);
        }
        // The pickup address is shared once the offer is accepted
        if (status === "Scheduled") {
          rows.push(["Pickup Address", offer.pickup_address || "N/A"]);
          if (offer.pickup_at) rows.push(["Pickup Time", formatPickup(offer.pickup_at)]);
        }
        if (status === "Completed" && offer.people_fed != null) {
          rows.push(["People Fed", offer.people_fed]);
        }
        content.innerHTML =
          rows
            .map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`)
            .join("") + `<dt>Status</dt><dd>${statusBadge(status)}</dd>`;

        const addButton = (label, onClick) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn--solid";
          btn.textContent = label;
          btn.onclick = async () => {
            btn.disabled = true;
            await onClick();
            btn.disabled = false;
          };
          footer.appendChild(btn);
        };

        if (status === "Pending") {
          addButton("Accept", async () => {
            const values = await formDialog(
              "When will you collect it?",
              `<div class="field">
                <label for="pickup-at">Pickup date and time</label>
                <input type="datetime-local" id="pickup-at" name="pickup_at" class="input" required />
              </div>
              <p class="muted">The donor is told the time and given a pickup code to hand over when you collect.</p>`,
              "Accept Offer"
            );
            if (!values) return;
            try {
              await offerAction(id, "accept", values);
              showToast("Offer accepted. The donor has been told the pickup time.", "success");
              renderOffers();
              // Reload the dialog: it now shows the pickup address and "Confirm Pickup"
              await showOffer(id);
            } catch (err) {
              showToast(err.message || "Error accepting offer.", "error");
            }
          });
        }
        if (status === "Scheduled") {
          addButton("Confirm Pickup", async () => {
            const values = await formDialog(
              "Confirm pickup",
              `<div class="field">
                <label for="pickup-code">Pickup code from the donor</label>
                <input type="text" id="pickup-code" name="code" class="input input--code" inputmode="numeric" maxlength="6" autocomplete="off" />
              </div>
              <div class="field">
                <label for="people-fed">People this will feed (optional)</label>
                <input type="number" id="people-fed" name="people_fed" min="0" class="input" />
              </div>`,
              "Confirm"
            );
            if (!values) return;
            try {
              await offerAction(id, "arrived", values);
              modal.close();
              showToast("Pickup confirmed. The donor has been told.", "success");
              renderOffers();
            } catch (err) {
              showToast(err.message || "Error confirming pickup.", "error");
            }
          });
        }
      }

      renderOffers();
    </script>
  </body>
</html>
