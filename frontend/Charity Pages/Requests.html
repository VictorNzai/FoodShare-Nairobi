<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requests - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <style>
      /* Two actions may stack so the table fits without scrolling */
      .table .btn-row {
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="charity" data-page="requests">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Recent Requests</h1>
            <p class="page-lede">The food needs you have posted.</p>
          </div>
          <div class="btn-row">
            <a class="btn btn--solid" href="./PostFoodNeed.html">Post a New Food Need</a>
          </div>
        </div>

        <div class="panel card">
          <div class="table-wrap">
            <table class="table" id="requests-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Food Item</th>
                  <th>Quantity</th>
                  <th>Pickup Location</th>
                  <th>Notes</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="requests-body"></tbody>
            </table>
          </div>
        </div>

        <dialog class="dialog" id="details-modal" aria-labelledby="detailsModalTitle">
          <h2 class="dialog-title" id="detailsModalTitle">Request Details</h2>
          <dl class="detail-list" id="modal-details-content"></dl>
          <div class="dialog-actions" id="modal-details-footer"></div>
        </dialog>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const charity = getCharity();
      let needs = [];
      const needId = (need) => need._id || need.id || "";

      // Load this charity's food needs
      async function renderRequests() {
        const tbody = document.getElementById("requests-body");
        tableLoading(tbody, ["num", "text", "num", "text", "text", "badge", "btn"]);
        try {
          const res = await fetch(
            `${API_BASE_URL}/api/foodneeds?org=${encodeURIComponent(charity.name)}`
          );
          if (!res.ok) throw new Error("Failed to fetch food needs");
          needs = await res.json();
          tbody.innerHTML = needs.length
            ? needs
                .map(
                  (need, index) => `<tr>
                    <td class="num">${esc(
                      need.date ? String(need.date).slice(0, 10) : ""
                    )}</td>
                    <td>${esc(need.food_item)}</td>
                    <td class="num">${esc(need.quantity)}</td>
                    <td>${esc(need.pickup_location || "")}</td>
                    <td>${esc(need.notes || "")}</td>
                    <td>${statusBadge(need.status)}</td>
                    <td><div class="btn-row">
                      <button type="button" class="btn btn--quiet" onclick="showRequest(${index})">View Details</button>
                      ${
                        need.status === "Completed"
                          ? ""
                          : `<button type="button" class="btn btn--danger" onclick="cancelRequest(${index})">Cancel</button>`
                      }
                    </div></td>
                  </tr>`
                )
                .join("")
            : noteRow(7, "No food needs posted yet.");
        } catch (err) {
          tbody.innerHTML = noteRow(7, "Error loading requests.");
        }
      }

      async function cancelRequest(index) {
        const id = needId(needs[index]);
        if (!id) return;
        const ok = await confirmDialog(
          "This cannot be undone and the request will be permanently removed.",
          {
            title: "Cancel this request?",
            confirmLabel: "Cancel request",
            danger: true,
          }
        );
        if (!ok) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/foodneeds/${id}`, {
            method: "DELETE",
          });
          if (!res.ok) throw new Error("Failed to cancel request");
          showToast("Request cancelled.", "success");
          renderRequests();
        } catch (err) {
          showToast("Error cancelling request.", "error");
        }
      }

      function showRequest(index) {
        const need = needs[index];
        const modal = document.getElementById("details-modal");
        const rows = [
          ["Date", need.date ? String(need.date).slice(0, 10) : ""],
          ["Type", "Request"],
          ["Food Item", need.food_item],
          ["Quantity", need.quantity],
          ["Pickup Location", need.pickup_location || "-"],
          ["Notes", need.notes || "-"],
        ];
        document.getElementById("modal-details-content").innerHTML =
          rows
            .map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`)
            .join("") + `<dt>Status</dt><dd>${statusBadge(need.status)}</dd>`;

        const footer = document.getElementById("modal-details-footer");
        footer.innerHTML =
          '<button type="button" class="btn btn--quiet" id="details-close">Close</button>';
        document.getElementById("details-close").onclick = () => modal.close();

        // A scheduled delivery can be marked as arrived
        if (need.status === "Scheduled") {
          const arrivedBtn = document.createElement("button");
          arrivedBtn.type = "button";
          arrivedBtn.className = "btn btn--solid";
          arrivedBtn.textContent = "Arrived";
          arrivedBtn.onclick = async function () {
            arrivedBtn.disabled = true;
            try {
              const res = await fetch(
                `${API_BASE_URL}/api/foodneeds/${needId(need)}/arrived`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ status: "Completed" }),
                }
              );
              if (!res.ok) throw new Error("Failed to mark as arrived");
              modal.close();
              showToast("Marked as completed!", "success");
              renderRequests();
            } catch (err) {
              arrivedBtn.disabled = false;
              showToast("Error marking as completed.", "error");
            }
          };
          footer.appendChild(arrivedBtn);
        }
        modal.showModal();
      }

      renderRequests();
    </script>
  </body>
</html>
