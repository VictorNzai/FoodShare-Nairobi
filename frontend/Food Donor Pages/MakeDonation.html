<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make a Donation - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="donations">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Make a Food Donation</h1>
            <p class="page-lede" id="donating-to-charity" hidden>
              Donating to: <strong id="donation-charity-name"></strong>
            </p>
          </div>
        </div>

        <div class="narrow">
          <form id="donationForm" class="panel card">
            <div class="field">
              <label for="category">Food Category</label>
              <select id="category" name="category" class="input" required>
                <option value="">Select a category</option>
                <option value="Cereals">Cereals</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Fruits">Fruits</option>
                <option value="Dairy">Dairy</option>
                <option value="Baked Goods">Baked Goods</option>
                <option value="Canned Foods">Canned Foods</option>
                <option value="Meat &amp; Poultry">Meat &amp; Poultry</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="description">Food Description</label>
              <input type="text" id="description" name="description" class="input" required placeholder="e.g. Brown rice, 2 loaves of bread" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" class="input" required placeholder="e.g. 5" />
              </div>
              <div class="field">
                <label for="unit">Unit</label>
                <select id="unit" name="unit" class="input" required>
                  <option value="kg">kg</option>
                  <option value="g">g</option>
                  <option value="liters">liters</option>
                  <option value="pieces">pieces</option>
                  <option value="packs">packs</option>
                  <option value="other">other</option>
                </select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="expiry">Expiry Date</label>
                <input type="date" id="expiry" name="expiry" class="input" required />
              </div>
              <div class="field">
                <label for="pickup_address">Pickup Address</label>
                <input type="text" id="pickup_address" name="pickup_address" class="input" required placeholder="e.g. 123 Main St, Nairobi" />
              </div>
            </div>
            <div class="field">
              <label for="notes">Additional Notes (optional)</label>
              <textarea id="notes" name="notes" class="input" rows="2" placeholder="Any special instructions..."></textarea>
            </div>
            <button type="submit" class="pill pill--solid pill--block">
              Submit Donation
              <span class="pill-arrow">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>
          </form>
          <div id="form-message" class="alert" role="status" style="margin-top: 1rem"></div>
          <p style="margin-top: 1.5rem">
            <a class="link" href="./FoodDonor.html">&larr; Back to Dashboard</a>
          </p>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      // Show "Donating to" if a charity was chosen beforehand
      const donationCharity = readStored("donationCharity");
      if (donationCharity && donationCharity.orgname) {
        document.getElementById("donating-to-charity").hidden = false;
        document.getElementById("donation-charity-name").textContent =
          donationCharity.orgname;
      }

      document.getElementById("donationForm").onsubmit = async function (e) {
        e.preventDefault();
        const donor = getDonor();
        const msg = document.getElementById("form-message");
        const submitBtn = this.querySelector('[type="submit"]');
        const offerMode = localStorage.getItem("donationOfferMode") === "true";
        const donationCharity = readStored("donationCharity");
        let data = {};
        if (offerMode && donationCharity && donationCharity.charity_id) {
          // Donor Offer Mode
          data = {
            donor_id: donor.id,
            donor_name: donor.fullname || donor.name || "",
            charity_id: donationCharity.charity_id || donationCharity.id,
            charity_name: donationCharity.charity_name || donationCharity.orgname,
            food_type: this.category.value,
            quantity: `${this.quantity.value} ${this.unit.value}`,
            message: this.notes.value,
            description: this.description.value,
            unit: this.unit.value,
            expiry: this.expiry.value,
            pickup_address: this.pickup_address.value,
          };
        } else {
          // Standard Donation
          data = {
            donor_id: donor.id,
            category: this.category.value,
            description: this.description.value,
            quantity: this.quantity.value,
            unit: this.unit.value,
            expiry: this.expiry.value,
            pickup_address: this.pickup_address.value,
            notes: this.notes.value,
          };
          // Attach charity info if present (legacy)
          if (donationCharity && donationCharity.orgname) {
            data.charity_orgname = donationCharity.orgname;
            data.charity_reg = donationCharity.reg;
            data.charity_email = donationCharity.email;
          }
        }
        const endpoint =
          offerMode && data.charity_id ? "/api/donor-offers" : "/api/donations";

        setBusy(submitBtn, true);
        try {
          const res = await fetch(API_BASE_URL + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            let thankYouMsg = "Donation submitted successfully!";
            if (offerMode && donationCharity && donationCharity.charity_name) {
              thankYouMsg = `Thank you for your offer to ${donationCharity.charity_name}!`;
            } else if (donationCharity && donationCharity.orgname) {
              thankYouMsg = `Thank you for donating to ${donationCharity.orgname}!`;
            }
            msg.textContent = thankYouMsg;
            msg.className = "alert alert--success";
            this.reset();
            // Remove charity info and offer mode after a successful donation/offer
            localStorage.removeItem("donationCharity");
            localStorage.removeItem("donationOfferMode");
            document.getElementById("donating-to-charity").hidden = true;
          } else {
            const err = await res.json().catch(() => ({}));
            msg.textContent = err.message || "Failed to submit donation.";
            msg.className = "alert alert--error";
          }
        } catch {
          msg.textContent = "Could not reach the server. Please try again.";
          msg.className = "alert alert--error";
        }
        setBusy(submitBtn, false);
      };
    </script>
  </body>
</html>
