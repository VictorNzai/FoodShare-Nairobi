<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="account">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Account</h1>
            <p class="page-lede">Your details and email verification.</p>
          </div>
        </div>

        <div class="narrow stack">
          <div class="panel card">
            <div class="profile-head">
              <span class="avatar avatar--lg" id="profileAvatar"></span>
              <div>
                <h2 class="profile-name" id="donorName"></h2>
                <span id="verifyStatus"></span>
              </div>
            </div>
            <dl class="detail-list" id="profileDetails"></dl>

            <!-- Email verification (shown until the email is verified) -->
            <div id="verifySection" hidden style="margin-top: 1.25rem">
              <button type="button" class="btn" id="verifyEmailBtn">Verify Email Address</button>
              <form id="otpForm" hidden style="margin-top: 1rem">
                <div class="field">
                  <label for="otpInput">Enter the 6-digit code we emailed you</label>
                  <input type="text" id="otpInput" class="input input--code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter OTP" required />
                </div>
                <button type="submit" class="btn btn--solid" id="submitOtpBtn">Submit OTP</button>
              </form>
            </div>

            <div class="card-foot" style="justify-content: flex-start" id="profileActions">
              <button type="button" class="btn btn--solid" onclick="showEditForm()">Edit Profile</button>
              <button type="button" class="btn btn--danger" onclick="deleteAccount()">Delete Account</button>
            </div>
          </div>

          <form id="editForm" class="panel card" hidden>
            <div class="card-head">
              <h2 class="card-title">Edit Profile</h2>
            </div>
            <div class="field">
              <label for="editName">Full Name</label>
              <input type="text" id="editName" name="editName" class="input" autocomplete="name" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" name="editEmail" class="input" autocomplete="email" required />
              </div>
              <div class="field">
                <label for="editPhone">Phone</label>
                <input type="tel" id="editPhone" name="editPhone" class="input" autocomplete="tel" />
              </div>
            </div>
            <div class="btn-row">
              <button type="submit" class="btn btn--solid">Save Changes</button>
              <button type="button" class="btn btn--quiet" onclick="document.getElementById('editForm').hidden = true">Cancel</button>
            </div>
          </form>

          <p><a class="link" href="./FoodDonor.html">&larr; Back to Dashboard</a></p>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const donor = getDonor();
      const donorFullName = donorDisplayName(donor);

      function setDonor(updated) {
        localStorage.setItem("donor", JSON.stringify(updated));
      }

      // Name, avatar and verification status
      document.getElementById("donorName").textContent = donorFullName;
      document.getElementById("profileAvatar").textContent =
        initials(donorFullName);
      document.getElementById("verifyStatus").innerHTML = statusBadge(
        donor.verified ? "Verified" : "Not Verified"
      );

      // Profile details
      const details = [["Full Name", donorFullName]];
      if (donor.email) details.push(["Email", donor.email]);
      if (donor.phone) details.push(["Phone", donor.phone]);
      document.getElementById("profileDetails").innerHTML = details
        .map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`)
        .join("");

      // --- Email verification: send a code, then check it ---
      document.getElementById("verifySection").hidden =
        donor.verified || !donor.email;

      document.getElementById("verifyEmailBtn").onclick = function () {
        const btn = this;
        btn.disabled = true;
        fetch(`${API_BASE_URL}/api/email/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: donor.email }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              showToast(
                "An OTP has been sent to your email address. Please check your inbox.",
                "success"
              );
              document.getElementById("otpForm").hidden = false;
              document.getElementById("otpInput").focus();
            } else {
              showToast("Failed to send OTP: " + (data.message || ""), "error");
            }
          })
          .catch(() => showToast("Failed to send OTP.", "error"))
          .finally(() => (btn.disabled = false));
      };

      document.getElementById("otpForm").onsubmit = function (e) {
        e.preventDefault();
        const otp = document.getElementById("otpInput").value.trim();
        const btn = document.getElementById("submitOtpBtn");
        btn.disabled = true;
        fetch(`${API_BASE_URL}/api/email/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: donor.email, otp }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              showToast("Email verified successfully!", "success");
              setDonor({ ...donor, verified: true });
              setTimeout(() => window.location.reload(), 1200);
            } else {
              btn.disabled = false;
              showToast(
                "OTP verification failed: " + (data.message || ""),
                "error"
              );
            }
          })
          .catch(() => {
            btn.disabled = false;
            showToast("Failed to verify OTP.", "error");
          });
      };

      // --- Edit profile ---
      function showEditForm() {
        const form = document.getElementById("editForm");
        form.editName.value = donor.fullname || donor.name || "";
        form.editEmail.value = donor.email || "";
        form.editPhone.value = donor.phone || "";
        form.hidden = false;
        form.editName.focus();
      }

      document.getElementById("editForm").onsubmit = function (e) {
        e.preventDefault();
        const form = e.target;
        // Keep the id and everything else already stored about the donor
        setDonor({
          ...donor,
          name: form.editName.value,
          fullname: form.editName.value,
          email: form.editEmail.value,
          phone: form.editPhone.value,
          // a changed email address has not been verified
          verified: donor.verified && form.editEmail.value === donor.email,
        });
        localStorage.setItem("donorName", form.editName.value);
        showToast("Profile updated!", "success");
        setTimeout(() => window.location.reload(), 1000);
      };

      // --- Delete account ---
      // TODO: there is no server endpoint a donor can call to delete their
      // account yet, so this only signs out and clears this browser.
      async function deleteAccount() {
        const ok = await confirmDialog(
          "Deleting your account online isn't available yet. This will sign you out and clear your details from this browser. Your account and donation history stay on FoodShare.",
          {
            title: "Sign out and clear this device?",
            confirmLabel: "Sign out and clear",
            danger: true,
          }
        );
        if (ok) logout();
      }
    </script>
  </body>
</html>
