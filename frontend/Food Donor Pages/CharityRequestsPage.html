<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charity Food Requests - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="requests">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Charity Food Requests</h1>
            <p class="page-lede">What charities need right now. Pledge to fulfil a request.</p>
          </div>
        </div>

        <div id="charity-requests-cards" class="card-grid"></div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      // Fetch and render requests as cards
      function fetchCharityRequestsCards() {
        const container = document.getElementById("charity-requests-cards");
        container.innerHTML = '<p class="muted">Loading requests...</p>';
        fetch(`${API_BASE_URL}/api/charity-requests`)
          .then((res) => res.json())
          .then((data) => {
            if (!data.success || !data.requests.length) {
              container.innerHTML =
                '<p class="muted">No open requests from charities at this time.</p>';
              return;
            }
            container.innerHTML = data.requests
              .map(
                (req) => `<div class="panel card card--stack">
                  <p class="muted">${esc(req.org_name)}${
                  req.date
                    ? " · " + new Date(req.date).toLocaleDateString()
                    : ""
                }</p>
                  <h2 class="card-heading">${esc(req.food_item)}</h2>
                  <p class="muted">Quantity: <strong>${esc(
                    req.quantity
                  )}</strong></p>
                  <p class="muted">Pickup Location: <strong>${esc(
                    req.pickup_location
                  )}</strong></p>
                  ${
                    req.notes
                      ? `<p class="muted">Notes: ${esc(req.notes)}</p>`
                      : ""
                  }
                  <div class="card-foot">
                    <a class="btn btn--solid" href="CharityRequestDetails.html?id=${encodeURIComponent(
                      req.id
                    )}">View Details</a>
                  </div>
                </div>`
              )
              .join("");
          })
          .catch(() => {
            container.innerHTML =
              '<p class="muted">Failed to load requests.</p>';
          });
      }
      fetchCharityRequestsCards();
    </script>
  </body>
</html>
