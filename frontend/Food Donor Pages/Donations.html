<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Donations - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="donations">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">All Donations</h1>
            <p class="page-lede">Every offer and donation you have made.</p>
          </div>
        </div>

            <div class="panel card">
              <div class="card-head">
                <h2 class="card-title">All Donations</h2>
                <div class="toolbar">
                  <label>
                    Status
                    <select id="donation-status-filter" class="input input--sm">
                      <option value="all">All</option>
                    <option value="Pending">Pending</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Picked Up">Picked Up</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Donation ID</th>
                      <th>Charity</th>
                      <th>Food Items</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="donationsBody"></tbody>
                </table>
              </div>
            </div>

        <dialog class="dialog" id="donation-modal" aria-labelledby="donationModalTitle">
          <h2 class="dialog-title" id="donationModalTitle">Donation Details</h2>
          <dl class="detail-list" id="modal-content"></dl>
          <form method="dialog" class="dialog-actions">
            <button class="btn btn--solid">Close</button>
          </form>
        </dialog>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="DonationsTable.js"></script>
    <script>
      // The table and details dialog are handled by DonationsTable.js
    </script>
  </body>
</html>
