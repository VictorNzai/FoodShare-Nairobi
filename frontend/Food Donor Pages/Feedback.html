<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="feedback">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Submit Feedback</h1>
            <p class="page-lede">Tell us what is working and what is not.</p>
          </div>
        </div>

        <div class="narrow">
          <form id="feedback-form" class="panel card">
            <div class="field-row">
              <div class="field">
                <label for="category">Category</label>
                <select id="category" name="category" class="input">
                  <option value="General">General</option>
                  <option value="Bug">Bug</option>
                  <option value="Suggestion">Suggestion</option>
                  <option value="Feature Request">Feature Request</option>
                  <option value="User Experience">User Experience</option>
                  <option value="Compliment">Compliment</option>
                  <option value="Complaint">Complaint</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="field">
                <label for="rating">Rating (1-5, optional)</label>
                <input type="number" id="rating" name="rating" min="1" max="5" class="input" />
              </div>
            </div>
            <div class="field">
              <label for="comment">Your Feedback</label>
              <textarea id="comment" name="comment" rows="4" class="input" required placeholder="Type your feedback here..."></textarea>
            </div>
            <button type="submit" class="pill pill--solid pill--block">
              Submit
              <span class="pill-arrow">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>
          </form>
          <div id="feedback-message" class="alert" role="status" style="margin-top: 1rem"></div>
          <div id="cases-root" class="stack" style="margin-top: 1.5rem"></div>
          <p style="margin-top: 1.5rem">
            <a class="link" href="./FoodDonor.html">&larr; Back to Dashboard</a>
          </p>
        </div>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/cases.js"></script>
    <script>
      document.getElementById("feedback-form").onsubmit = async function (e) {
        e.preventDefault();
        const msg = document.getElementById("feedback-message");
        const submitBtn = this.querySelector('[type="submit"]');
        const comment = document.getElementById("comment").value.trim();
        const rating = document.getElementById("rating").value;
        const category = document.getElementById("category").value;
        if (!comment) {
          msg.textContent = "Feedback cannot be empty.";
          msg.className = "alert alert--error";
          return;
        }
        setBusy(submitBtn, true);
        try {
          const res = await fetch(`${API_BASE_URL}/api/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              donor_id: getDonor().id,
              comment,
              rating: rating ? parseInt(rating) : null,
              category,
            }),
          });
          const data = await res.json();
          if (data.success) {
            // Show thank you message briefly, then redirect
            msg.textContent =
              "Thank you for your feedback! Redirecting to dashboard...";
            msg.className = "alert alert--success";
            this.reset();
            setTimeout(function () {
              window.location.href = "./FoodDonor.html";
            }, 1200);
            return;
          }
          msg.textContent = data.error || "Failed to submit feedback.";
          msg.className = "alert alert--error";
        } catch {
          msg.textContent = "Failed to submit feedback.";
          msg.className = "alert alert--error";
        }
        setBusy(submitBtn, false);
      };
    </script>
  </body>
</html>
