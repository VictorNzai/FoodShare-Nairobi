<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charity Request Details - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="requests">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Request Details</h1>
            <p class="page-lede"><a class="link" href="./CharityRequestsPage.html">&larr; Back to Requests</a></p>
          </div>
        </div>

        <div id="request-details" class="panel card card--stack narrow"></div>

        <!-- Pledge Form -->
        <dialog class="dialog dialog--form" id="pledge-modal" aria-labelledby="pledgeModalTitle">
          <h2 class="dialog-title" id="pledgeModalTitle">Schedule a Ride!</h2>
          <form id="pledge-form">
            <div class="field">
              <label for="pledge-location">Pickup Location</label>
              <input type="text" id="pledge-location" name="pickup_location" class="input" required placeholder="e.g. 123 Main St, Nairobi" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="pledge-date">Date of Pickup</label>
                <input type="date" id="pledge-date" name="pickup_date" class="input" required />
              </div>
              <div class="field">
                <label for="pledge-phone">Contact Phone</label>
                <input type="tel" id="pledge-phone" name="contact_phone" class="input" required placeholder="e.g. 0712 345678" />
              </div>
            </div>
            <div class="field">
              <label for="pledge-notes">Additional Notes (optional)</label>
              <textarea id="pledge-notes" name="notes" class="input" rows="2" placeholder="Any special instructions..."></textarea>
            </div>
            <div id="pledge-message" class="alert" role="alert"></div>
            <div class="dialog-actions">
              <button type="button" class="btn btn--quiet" onclick="this.closest('dialog').close()">Cancel</button>
              <button type="submit" class="btn btn--solid">Submit Pledge</button>
            </div>
          </form>
        </dialog>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      const requestId = new URLSearchParams(window.location.search).get("id");

      // Fetch and render request details
      function fetchRequestDetails() {
        const detailsDiv = document.getElementById("request-details");
        if (!requestId) {
          detailsDiv.innerHTML = '<p class="muted">Invalid request ID.</p>';
          return;
        }
        detailsDiv.innerHTML = '<p class="muted">Loading details...</p>';
        fetch(
          `${API_BASE_URL}/api/charity-requests/${encodeURIComponent(requestId)}`
        )
          .then((res) => res.json())
          .then((data) => {
            if (!data.success || !data.request) {
              detailsDiv.innerHTML = '<p class="muted">Request not found.</p>';
              return;
            }
            const req = data.request;
            detailsDiv.innerHTML = `
              <p class="muted">${esc(req.org_name)}${
              req.date ? " · " + new Date(req.date).toLocaleDateString() : ""
            }</p>
              <h2 class="profile-name">${esc(req.food_item)}</h2>
              <p>Quantity: <strong>${esc(req.quantity)}</strong></p>
              <p>Pickup Location: <strong>${esc(req.pickup_location)}</strong></p>
              ${req.notes ? `<p>Notes: ${esc(req.notes)}</p>` : ""}
              <div class="card-foot" style="justify-content: flex-start">
                <button type="button" class="pill pill--solid" id="pledge-btn">Pledge to Fulfill
                  <span class="pill-arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
                </button>
              </div>`;
            document.getElementById("pledge-btn").onclick = () =>
              document.getElementById("pledge-modal").showModal();
          })
          .catch(() => {
            detailsDiv.innerHTML = '<p class="muted">Failed to load details.</p>';
          });
      }
      fetchRequestDetails();

      // Handle pledge form submit
      document.getElementById("pledge-form").onsubmit = async function (e) {
        e.preventDefault();
        const form = e.target;
        const msg = document.getElementById("pledge-message");
        const submitBtn = form.querySelector('[type="submit"]');
        const data = {
          pickup_location: form.pickup_location.value.trim(),
          date: form.pickup_date.value,
          contact_phone: form.contact_phone.value.trim(),
          notes: form.notes.value.trim(),
        };
        msg.textContent = "";
        msg.className = "alert";
        submitBtn.disabled = true;
        try {
          const res = await fetch(
            `${API_BASE_URL}/api/food-needs/${encodeURIComponent(
              requestId
            )}/schedule-pledge`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            }
          );
          if (res.ok) {
            form.reset();
            document.getElementById("pledge-modal").close();
            showToast("Pledge submitted! Thank you for helping.", "success");
            fetchRequestDetails();
          } else {
            const err = await res.json().catch(() => ({}));
            msg.textContent = err.message || "Failed to submit pledge.";
            msg.className = "alert alert--error";
          }
        } catch (err) {
          msg.textContent = "Failed to submit pledge.";
          msg.className = "alert alert--error";
        }
        submitBtn.disabled = false;
      };
    </script>
  </body>
</html>
