<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Charities - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <!-- Sidebar and mobile menu are added by /js/app-shell.js -->
    <div class="app" data-role="donor" data-page="charities">
      <main class="app-main">
        <div class="page-head">
          <div>
            <h1 class="page-title">Browse Charities</h1>
            <p class="page-lede">Pick a charity and offer it food directly.</p>
          </div>
        </div>

        <div id="charities-cards" class="card-grid"></div>

        <!-- Charity Details -->
        <dialog class="dialog" id="charity-details-modal" aria-labelledby="modal-orgname">
          <h2 class="dialog-title" id="modal-orgname"></h2>
          <dl class="detail-list">
            <dt>Email</dt><dd id="modal-email"></dd>
            <dt>Phone</dt><dd id="modal-phone"></dd>
            <dt>Registration No.</dt><dd id="modal-reg"></dd>
            <dt>Address</dt><dd id="modal-address"></dd>
          </dl>
          <div class="dialog-actions">
            <button type="button" class="btn btn--quiet" onclick="this.closest('dialog').close()">Close</button>
            <button type="button" class="btn btn--solid" id="donate-to-charity-btn">Donate to this Charity</button>
          </div>
        </dialog>

        <!-- Offer food to the chosen charity -->
        <dialog class="dialog dialog--form" id="donor-offer-modal" aria-labelledby="offerModalTitle">
          <h2 class="dialog-title" id="offerModalTitle">Offer Food to Charity</h2>
          <form id="donor-offer-form">
            <p class="muted" style="margin-bottom: 1rem">Charity: <strong id="donor-offer-charity"></strong></p>
            <div class="field">
              <label for="offer-category">Food Category</label>
              <select id="offer-category" name="food_type" class="input" required>
                <option value="">Select a category</option>
                <option value="Cereals">Cereals</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Fruits">Fruits</option>
                <option value="Dairy">Dairy</option>
                <option value="Baked Goods">Baked Goods</option>
                <option value="Canned Foods">Canned Foods</option>
                <option value="Meat &amp; Poultry">Meat &amp; Poultry</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="offer-description">Food Description</label>
              <input type="text" id="offer-description" name="description" class="input" required placeholder="e.g. Brown rice, 2 loaves of bread" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="offer-quantity">Quantity</label>
                <input type="number" id="offer-quantity" name="quantity" min="1" class="input" required placeholder="e.g. 5" />
              </div>
              <div class="field">
                <label for="offer-unit">Unit</label>
                <select id="offer-unit" name="unit" class="input" required>
                  <option value="kg">kg</option>
                  <option value="g">g</option>
                  <option value="liters">liters</option>
                  <option value="pieces">pieces</option>
                  <option value="packs">packs</option>
                  <option value="other">other</option>
                </select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="offer-expiry">Expiry Date</label>
                <input type="date" id="offer-expiry" name="expiry" class="input" required />
              </div>
              <div class="field">
                <label for="offer-pickup_address">Pickup Address</label>
                <input type="text" id="offer-pickup_address" name="pickup_address" class="input" required placeholder="e.g. 123 Main St, Nairobi" />
              </div>
            </div>
            <div class="field">
              <label for="offer-notes">Additional Notes (optional)</label>
              <textarea id="offer-notes" name="notes" class="input" rows="2" placeholder="Any special instructions..."></textarea>
            </div>
            <div id="donor-offer-message" class="alert" role="alert"></div>
            <div class="dialog-actions">
              <button type="button" class="btn btn--quiet" onclick="this.closest('dialog').close()">Cancel</button>
              <button type="submit" class="btn btn--solid">Submit Offer</button>
            </div>
          </form>
        </dialog>

        <footer class="app-foot">
          <p>&copy; 2025 FoodShare. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
      let charities = [];
      let selectedCharity = null;

      // Fetch and render charities as cards
      function fetchCharitiesCards() {
        const container = document.getElementById("charities-cards");
        container.innerHTML = '<p class="muted">Loading charities...</p>';
        fetch(`${API_BASE_URL}/api/charities`)
          .then((res) => res.json())
          .then((data) => {
            if (!data.success || !data.charities.length) {
              container.innerHTML =
                '<p class="muted">No charities found at this time.</p>';
              return;
            }
            charities = data.charities;
            container.innerHTML = charities
              .map(
                (charity, idx) => `<div class="panel card card--stack">
                  <h2 class="card-heading">${esc(charity.orgname)}</h2>
                  ${
                    charity.reg
                      ? `<p class="muted">Reg: ${esc(charity.reg)}</p>`
                      : ""
                  }
                  <p class="muted">${esc(charity.email)}</p>
                  <p class="muted">${esc(charity.phone)}</p>
                  <div class="card-foot">
                    <button type="button" class="btn btn--solid" onclick="showCharityDetails(${idx})">View Details</button>
                  </div>
                </div>`
              )
              .join("");
          })
          .catch(() => {
            container.innerHTML =
              '<p class="muted">Failed to load charities.</p>';
          });
      }

      function showCharityDetails(idx) {
        const charity = (selectedCharity = charities[idx]);
        document.getElementById("modal-orgname").textContent = charity.orgname;
        document.getElementById("modal-email").textContent = charity.email;
        document.getElementById("modal-phone").textContent = charity.phone;
        document.getElementById("modal-reg").textContent = charity.reg || "-";
        document.getElementById("modal-address").textContent =
          charity.address || "-";
        document.getElementById("charity-details-modal").showModal();
      }

      // "Donate to this Charity" swaps the details dialog for the offer form
      document.getElementById("donate-to-charity-btn").onclick = function () {
        document.getElementById("charity-details-modal").close();
        document.getElementById("donor-offer-charity").textContent =
          selectedCharity.orgname;
        const msg = document.getElementById("donor-offer-message");
        msg.textContent = "";
        msg.className = "alert";
        document.getElementById("donor-offer-modal").showModal();
      };

      document.getElementById("donor-offer-form").onsubmit = async function (e) {
        e.preventDefault();
        const form = e.target;
        const donor = getDonor();
        const charity = selectedCharity;
        const msg = document.getElementById("donor-offer-message");
        const submitBtn = form.querySelector('[type="submit"]');
        const data = {
          donor_id: donor.id,
          donor_name: (donor.fullname || donor.name || "").trim(),
          charity_id: charity.id || charity.charity_id || "",
          charity_name: (charity.orgname || charity.charity_name || "").trim(),
          food_type: (form.food_type.value || "").trim(),
          description: (form.description.value || "").trim(),
          quantity: parseInt(form.quantity.value, 10) || 0,
          unit: (form.unit.value || "").trim(),
          expiry: (form.expiry.value || "").trim(),
          pickup_address: (form.pickup_address.value || "").trim(),
          notes: (form.notes.value || "").trim(),
        };
        submitBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE_URL}/api/donor-offers`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            form.reset();
            document.getElementById("donor-offer-modal").close();
            showToast("Offer submitted successfully!", "success");
          } else {
            const err = await res.json().catch(() => ({}));
            msg.textContent = err.message || "Failed to submit offer.";
            msg.className = "alert alert--error";
          }
        } catch {
          msg.textContent = "Could not reach the server. Please try again.";
          msg.className = "alert alert--error";
        }
        submitBtn.disabled = false;
      };

      fetchCharitiesCards();
    </script>
  </body>
</html>
