<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
  </head>
  <body>
    <main class="auth">
      <section class="panel auth-panel">
        <div class="auth-top">
          <a href="/" class="auth-logo">
            <svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
              <path
                d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z"
              />
            </svg>
            <span>FoodShare Kenya</span>
          </a>
          <span>New here? <a href="/Signup.html" class="link">Sign up</a></span>
        </div>

        <div class="auth-body">
          <h1 class="section-title auth-title">
            <span>Welcome</span>
            <span class="indent">Back</span>
          </h1>
          <p class="auth-lede">Log in to share or receive surplus food.</p>

          <div class="segmented toggle-role" role="group" aria-label="Account type">
            <button type="button" class="active" aria-pressed="true" onclick="setRole('donor', this)">Donor</button>
            <button type="button" aria-pressed="false" onclick="setRole('charity', this)">Charity</button>
            <button type="button" aria-pressed="false" onclick="setRole('admin', this)">Admin</button>
          </div>

          <form id="loginForm">
            <input type="hidden" id="role" name="role" value="donor" />

            <div class="field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                class="input"
                placeholder="your.email@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                class="input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>

            <div id="accessKeyContainer" style="display: none">
              <div class="field">
                <label for="accessKey">Admin Access Key</label>
                <input
                  type="text"
                  id="accessKey"
                  class="input"
                  placeholder="Enter admin key"
                  autocomplete="off"
                />
              </div>
            </div>

            <div class="auth-aside">
              <a href="/ForgotPassword.html" class="link">Forgot Password?</a>
            </div>

            <button type="submit" class="pill pill--solid pill--block">
              Log In
              <span class="pill-arrow">
                <svg
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>

            <p class="auth-foot">
              Don't have an account?
              <a href="/Signup.html" class="link">Sign Up</a>
            </p>
          </form>
        </div>
      </section>

      <figure class="auth-media">
        <img
          src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1400&q=75"
          alt="A market stall stacked with fruit and vegetables"
        />
        <figcaption>Fighting hunger, one meal at a time.</figcaption>
      </figure>
    </main>

    <script src="/js/ui.js"></script>
    <script>
      function setRole(role, btn) {
        document.getElementById("role").value = role;

        document.querySelectorAll(".toggle-role button").forEach((b) => {
          b.classList.toggle("active", b === btn);
          b.setAttribute("aria-pressed", b === btn);
        });

        const accessKeyContainer =
          document.getElementById("accessKeyContainer");
        accessKeyContainer.style.display = role === "admin" ? "block" : "none";
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const role = document.getElementById("role").value;
          const accessKey = document.getElementById("accessKey").value;
          const submitBtn = this.querySelector('[type="submit"]');

          let endpoint = "";
          let body = { email, password };

          if (role === "donor") {
            endpoint =
              "https://foodshare-nairobi-1.onrender.com/auth/login/donor";
          } else if (role === "charity") {
            endpoint =
              "https://foodshare-nairobi-1.onrender.com/auth/login/charity";
          } else if (role === "admin") {
            endpoint = "https://foodshare-nairobi-1.onrender.com/auth/login";
            body = { email, password, role, accessKey };
          }

          setBusy(submitBtn, true);
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });

            const data = await response.json();

            if (data.success) {
              if (role === "donor") {
                // Store username for greeting/sidebar
                let donorName =
                  data.donor && data.donor.username
                    ? data.donor.username
                    : "Donor";
                localStorage.setItem("donorName", donorName);
                localStorage.setItem("donor", JSON.stringify(data.donor)); // Save full donor object
                window.location.href = "/Food%20Donor%20Pages/FoodDonor.html";
              } else if (role === "charity") {
                // Store full charity info for profile/dashboard linkage, including id
                const charityJwt = {
                  id: data.charity.id,
                  name: data.charity.orgname,
                  email: data.charity.email,
                  phone: data.charity.phone,
                  reg: data.charity.reg,
                  verified:
                    data.charity.verified === true ||
                    data.charity.verified === 1,
                };
                localStorage.setItem("jwt", JSON.stringify(charityJwt));
                window.location.href = "/Charity%20Pages/CharityDashboard.html";
              } else if (role === "admin" && data.dashboard) {
                // Store admin name for greeting
                if (data.admin && data.admin.name) {
                  localStorage.setItem("adminName", data.admin.name);
                } else if (data.admin && data.admin.fullname) {
                  localStorage.setItem("adminName", data.admin.fullname);
                } else if (data.admin && data.admin.username) {
                  localStorage.setItem("adminName", data.admin.username);
                } else if (data.admin && data.admin.email) {
                  localStorage.setItem("adminName", data.admin.email);
                }
                window.location.href = "/AdminPages/AdminDashboard.html";
              } else {
                window.location.href = "/AdminPages/AdminDashboard.html";
              }
            } else {
              setBusy(submitBtn, false);
              showToast(data.message || "Login failed", "error");
            }
          } catch (error) {
            console.error("Login error:", error);
            setBusy(submitBtn, false);
            showToast("An error occurred during login.", "error");
          }
        });
    </script>
  </body>
</html>
