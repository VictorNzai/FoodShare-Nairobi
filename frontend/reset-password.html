<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
  </head>
  <body>
    <main class="auth">
      <section class="panel auth-panel">
        <div class="auth-top">
          <a href="/" class="auth-logo">
            <svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
              <path
                d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z"
              />
            </svg>
            <span>FoodShare Kenya</span>
          </a>
          <span><a href="/Login.html" class="link">Back to login</a></span>
        </div>

        <div class="auth-body">
          <h1 class="section-title auth-title">
            <span>Reset Your</span>
            <span class="indent">Password</span>
          </h1>
          <p class="auth-lede">Choose a new password for your account.</p>

          <form id="resetForm">
            <input type="hidden" id="token" />
            <input type="hidden" id="role" />

            <div class="field">
              <label for="password">New Password</label>
              <input
                type="password"
                id="password"
                class="input"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="field">
              <label for="confirmPassword">Confirm Password</label>
              <input
                type="password"
                id="confirmPassword"
                class="input"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" class="pill pill--solid pill--block">
              Reset Password
              <span class="pill-arrow">
                <svg
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>
          </form>
        </div>
      </section>

      <figure class="auth-media">
        <img
          src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1400&q=75"
          alt="A market stall stacked with fruit and vegetables"
        />
        <figcaption>Fighting hunger, one meal at a time.</figcaption>
      </figure>
    </main>

    <script src="/js/ui.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const role = params.get("role");

      document.getElementById("token").value = token;
      document.getElementById("role").value = role;

      document
        .getElementById("resetForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const submitBtn = this.querySelector('[type="submit"]');

          setBusy(submitBtn, true);
          try {
            const response = await fetch(
              "https://foodshare-nairobi-1.onrender.com/auth/reset-password",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  token,
                  role,
                  password,
                  confirmPassword,
                }),
              }
            );

            const data = await response.json();
            showToast(data.message, response.ok ? "success" : "error");
            // The API signals success by status code; it sends no `success` flag
            if (response.ok) {
              setTimeout(() => {
                window.location.href = "/Login.html";
              }, 1400);
              return;
            }
          } catch (error) {
            showToast("Something went wrong.", "error");
          }
          setBusy(submitBtn, false);
        });
    </script>
  </body>
</html>
