<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
  </head>
  <body>
    <main class="auth">
      <section class="panel auth-panel">
        <div class="auth-top">
          <a href="/" class="auth-logo">
            <svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
              <path
                d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z"
              />
            </svg>
            <span>FoodShare Kenya</span>
          </a>
          <span>Have an account? <a href="/Login.html" class="link">Log in</a></span>
        </div>

        <div class="auth-body auth-body--wide">
          <h1 class="section-title auth-title">
            <span>Create Your</span>
            <span class="indent">Account</span>
          </h1>
          <p class="auth-lede">Sign up as a donor or a charity in minutes.</p>

          <div class="segmented toggle-role" role="group" aria-label="Account type">
            <button type="button" id="donorBtn" class="active" aria-pressed="true">Donor</button>
            <button type="button" id="charityBtn" aria-pressed="false">Charity</button>
          </div>

          <!-- Donor Signup Form -->
          <form id="donorForm">
            <div class="field">
              <label for="fullname">Full Name</label>
              <input
                type="text"
                id="fullname"
                class="input"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="email">Email Address</label>
                <input
                  type="email"
                  id="email"
                  class="input"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="field">
                <label for="phone">Phone Number</label>
                <input
                  type="tel"
                  id="phone"
                  class="input"
                  placeholder="Enter your phone number"
                  autocomplete="tel"
                  required
                />
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  class="input"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="field">
                <label for="confirm">Confirm Password</label>
                <input
                  type="password"
                  id="confirm"
                  class="input"
                  placeholder="Confirm your password"
                  autocomplete="new-password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="pill pill--solid pill--block">
              Sign Up as Donor
              <span class="pill-arrow">
                <svg
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>

            <p class="auth-foot">
              Already have an account?
              <a href="/Login.html" class="link">Log in</a>
            </p>
          </form>

          <!-- Charity Signup Form -->
          <form id="charityForm" style="display: none">
            <div class="field">
              <label for="orgname">Organization Name</label>
              <input
                type="text"
                id="orgname"
                class="input"
                placeholder="Enter organization name"
                autocomplete="organization"
                required
              />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="email2">Email Address</label>
                <input
                  type="email"
                  id="email2"
                  class="input"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="field">
                <label for="phone2">Phone Number</label>
                <input
                  type="tel"
                  id="phone2"
                  class="input"
                  placeholder="Enter your phone number"
                  autocomplete="tel"
                  required
                />
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="reg">Registration Number</label>
                <input
                  type="text"
                  id="reg"
                  class="input"
                  placeholder="Enter registration number"
                  autocomplete="off"
                  required
                />
              </div>
              <div class="field">
                <label for="institutionType">Institution Type</label>
                <select id="institutionType" class="input" required>
                  <option value="">Select institution type</option>
                  <option value="Children's Home">Children’s Home</option>
                  <option value="Community Kitchen">Community Kitchen</option>
                  <option value="Rehabilitation Center">Rehabilitation Center</option>
                </select>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="password2">Password</label>
                <input
                  type="password"
                  id="password2"
                  class="input"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="field">
                <label for="confirm2">Confirm Password</label>
                <input
                  type="password"
                  id="confirm2"
                  class="input"
                  placeholder="Confirm your password"
                  autocomplete="new-password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="pill pill--solid pill--block">
              Sign Up as Charity
              <span class="pill-arrow">
                <svg
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
            </button>

            <p class="auth-foot">
              Already have an account?
              <a href="/Login.html" class="link">Log in</a>
            </p>
          </form>
        </div>
      </section>

      <figure class="auth-media">
        <img
          src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1400&q=75"
          alt="A market stall stacked with fruit and vegetables"
        />
        <figcaption>Fighting hunger, one meal at a time.</figcaption>
      </figure>
    </main>

    <script src="/js/ui.js"></script>
    <script>
      const donorBtn = document.getElementById("donorBtn");
      const charityBtn = document.getElementById("charityBtn");
      const donorForm = document.getElementById("donorForm");
      const charityForm = document.getElementById("charityForm");

      function showForm(isDonor) {
        donorBtn.classList.toggle("active", isDonor);
        charityBtn.classList.toggle("active", !isDonor);
        donorBtn.setAttribute("aria-pressed", isDonor);
        charityBtn.setAttribute("aria-pressed", !isDonor);
        donorForm.style.display = isDonor ? "block" : "none";
        charityForm.style.display = isDonor ? "none" : "block";
      }

      donorBtn.addEventListener("click", () => showForm(true));
      charityBtn.addEventListener("click", () => showForm(false));

      // Give the success toast a moment to be read before leaving the page
      const REDIRECT_DELAY = 1400;

      // Donor signup
      document
        .getElementById("donorForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const fullname = document.getElementById("fullname").value;
          const email = document.getElementById("email").value;
          const phone = document.getElementById("phone").value;
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirm").value;
          const submitBtn = this.querySelector('[type="submit"]');

          if (password !== confirmPassword)
            return showToast("Passwords do not match", "error");

          setBusy(submitBtn, true);
          try {
            const response = await fetch(
              "https://foodshare-nairobi-1.onrender.com/signup/donor",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  fullname,
                  email,
                  phone,
                  password,
                  confirmPassword,
                }),
              }
            );

            const result = await response.json();

            if (!response.ok) {
              console.error("Server error:", result.message);
              setBusy(submitBtn, false);
              return showToast("Signup failed: " + result.message, "error");
            }

            showToast(result.message + ". Please log in.", "success");
            // Signing up does not sign you in, so continue at the login page
            setTimeout(() => {
              window.location.href = "/Login.html";
            }, REDIRECT_DELAY);
          } catch (err) {
            console.error("Network error:", err);
            setBusy(submitBtn, false);
            showToast("Could not connect to server.", "error");
          }
        });

      // Charity signup
      document
        .getElementById("charityForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const orgname = document.getElementById("orgname").value;
          const email = document.getElementById("email2").value;
          const phone = document.getElementById("phone2").value;
          const reg = document.getElementById("reg").value;
          const institutionType =
            document.getElementById("institutionType").value;
          const password = document.getElementById("password2").value;
          const confirmPassword = document.getElementById("confirm2").value;
          const submitBtn = this.querySelector('[type="submit"]');

          if (password !== confirmPassword)
            return showToast("Passwords do not match", "error");

          if (!institutionType) {
            return showToast("Please select an institution type.", "error");
          }

          setBusy(submitBtn, true);
          try {
            const response = await fetch(
              "https://foodshare-nairobi-1.onrender.com/signup/charity",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  orgname,
                  email,
                  phone,
                  reg,
                  institutionType,
                  password,
                  confirmPassword,
                }),
              }
            );

            const result = await response.json();

            if (!response.ok) {
              console.error("Server error:", result.message);
              setBusy(submitBtn, false);
              return showToast("Signup failed: " + result.message, "error");
            }

            showToast(result.message + ". Please log in.", "success");
            // Signing up does not sign you in (and the charity's id is only
            // returned at login), so continue at the login page
            setTimeout(() => {
              window.location.href = "/Login.html";
            }, REDIRECT_DELAY);
          } catch (err) {
            console.error("Network error:", err);
            setBusy(submitBtn, false);
            showToast("Could not connect to server.", "error");
          }
        });
    </script>
  </body>
</html>
