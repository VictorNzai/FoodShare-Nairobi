<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - FoodShare</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/design-system.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
  </head>
  <body>
    <main class="auth" style="grid-template-columns: minmax(0, 1fr)">
      <section class="panel auth-panel">
        <div class="auth-top">
          <a href="/" class="auth-logo">
            <svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
              <path
                d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z"
              />
            </svg>
            <span>FoodShare Kenya</span>
          </a>
        </div>

        <div class="auth-body">
          <h1 class="section-title auth-title">
            <span>Page</span>
            <span class="indent">Not Found</span>
          </h1>
          <p class="auth-lede">
            That page doesn't exist or has moved. Check the address, or head
            back to the home page.
          </p>
          <a href="/" class="pill pill--solid">
            Back to Home
            <span class="pill-arrow">
              <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 8h10M9 4l4 4-4 4" />
              </svg>
            </span>
          </a>
          <p class="auth-foot">
            Have an account? <a href="/Login.html" class="link">Log in</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
